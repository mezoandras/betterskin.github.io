<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Karbantartás alatt – BetterSkin</title>

<!--
  KÉSŐBB ÁTÍRHATÓ RÉSZEK
  1. Várható visszatérés: a fájl alján, a VISSZATERES értéke (most "Hamarosan").
  2. Színek: a :root blokkban, közvetlenül ez alatt.
-->

<style>
  :root {
    --alap: #1d3bc1;       /* háttér */
    --szoveg: #f4f6ff;     /* fő szöveg */
    --halvany: #c3ccf5;    /* másodlagos szöveg */
    --jelzes: #ffc83d;     /* csavar, linkek, fókusz */
    --vonal: rgba(244, 246, 255, 0.28);

    --cimbetu: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
    --szovegbetu: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--alap);
    color: var(--szoveg);
    font-family: var(--szovegbetu);
    font-size: 1.0625rem;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .lap {
    min-height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(1.25rem, 4vw, 3rem);
    gap: clamp(1.5rem, 4vh, 3rem);
    overflow-x: clip;
  }

  .marka {
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  /* ---------- Címsor ---------- */

  .cim {
    align-self: end;
    margin: 0;
    font-family: var(--cimbetu);
    font-weight: 800;
    font-size: clamp(3.75rem, 18.6vw, 21rem);
    line-height: 0.82;
    letter-spacing: -0.005em;
    overflow-wrap: normal;
  }

  .cim span { display: block; }

  /* Az utolsó betű egyetlen csavaron lóg. */
  .cim .logo-betu {
    display: inline-block;
    position: relative;
    margin-left: 0.035em;
    transform-origin: 42% 21%;
    transform: rotate(-11deg);
    animation: kilazul 3.4s 0.9s cubic-bezier(0.45, 0, 0.55, 1) both;
  }

  .cim .logo-betu::before {
    content: "";
    position: absolute;
    left: 42%;
    top: 21%;
    width: 0.085em;
    height: 0.085em;
    margin: -0.0425em 0 0 -0.0425em;
    border-radius: 50%;
    background: var(--jelzes);
    box-shadow: 0 0 0 0.02em var(--alap);
  }

  @keyframes kilazul {
    0%   { transform: rotate(0deg); }
    16%  { transform: rotate(-25deg); }
    32%  { transform: rotate(-2deg); }
    48%  { transform: rotate(-18deg); }
    63%  { transform: rotate(-7deg); }
    77%  { transform: rotate(-14deg); }
    90%  { transform: rotate(-10deg); }
    100% { transform: rotate(-11deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .cim .logo-betu { animation: none; }
  }

  /* ---------- Alsó sáv ---------- */

  .also {
    display: grid;
    grid-template-columns: minmax(0, 34rem) minmax(0, 22rem);
    justify-content: space-between;
    align-items: start;
    gap: 2rem clamp(2rem, 6vw, 5rem);
    padding-top: clamp(1.25rem, 3vh, 2rem);
    border-top: 1px solid var(--vonal);
  }

  .uzenet {
    margin: 0;
    font-size: clamp(1.125rem, 1.1rem + 0.5vw, 1.4rem);
    line-height: 1.45;
    text-wrap: pretty;
  }

  .adatok {
    margin: 0;
    display: grid;
    gap: 0.9rem;
  }

  .adatok dt {
    color: var(--halvany);
    font-size: 0.9375rem;
  }

  .adatok dd {
    margin: 0;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  a {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: var(--jelzes);
    text-decoration-thickness: 2px;
    text-underline-offset: 0.2em;
  }

  a:hover { color: var(--jelzes); }

  .gomb {
    display: inline-block;
    margin-top: 1.3rem;
    padding: 0.7rem 1.15rem;
    border-radius: 3px;
    background: var(--jelzes);
    color: #16255f;
    font-weight: 700;
    text-decoration: none;
    transition: transform 0.12s ease;
  }

  .gomb:hover { color: #16255f; background: #ffd666; }
  .gomb:active { transform: translateY(1px); }

  :focus-visible {
    outline: 3px solid var(--jelzes);
    outline-offset: 3px;
  }

  .gomb:focus-visible { outline-color: var(--szoveg); }

  @media (max-width: 46rem) {
    .also { grid-template-columns: 1fr; }
    .cim { line-height: 0.86; }
  }
</style>

<script>
  // Ha üres (""), a "Hamarosan" felirat látszik.
  // Pontos időponthoz írd be így: "2026-10-06T18:00"
  const VISSZATERES = "";

  (function () {
    if (!VISSZATERES) return;
    const ido = new Date(VISSZATERES);
    if (isNaN(ido)) return;

    const mezo = document.getElementById("visszateres");

    function frissit() {
      if (ido <= new Date()) {
        mezo.textContent = "Bármelyik percben";
        return;
      }
      mezo.textContent = new Intl.DateTimeFormat("hu-HU", {
        month: "long", day: "numeric", hour: "2-digit", minute: "2-digit"
      }).format(ido);
    }

    frissit();
    setInterval(frissit, 30000);
  })();
